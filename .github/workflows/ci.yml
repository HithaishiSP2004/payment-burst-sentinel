name: CI — Payment Burst Sentinel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────
  # Frontend: TypeScript + Tests + Build
  # ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Production build
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # Backend: Python test suite & import validation
  # ──────────────────────────────────────────────────────────
  backend:
    name: Backend — Test & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend pytest suite
        run: python -m pytest tests/ -v

      - name: Validate backend imports
        run: |
          python -c "from backend.api import app; print(f'FastAPI app loaded: {app.title}')"
          python -c "from backend.anomaly_detector import AnomalyDetector; print('AnomalyDetector imported')"
          python -c "from backend.evaluation import evaluate_detection; print('Evaluation imported')"
